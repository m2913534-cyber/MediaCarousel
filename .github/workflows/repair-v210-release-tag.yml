name: Repair v2.10.0 release source tag
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Align release tag with the verified build source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          expected=eee5e7cc18e7ccff2b5bdae1e1036ed817046bf7
          target=4572dbd02dbefca4f4d3c5bbb5efed476dff44d2
          actual=$(gh api "repos/$GH_REPO/git/ref/tags/v2.10.0" --jq .object.sha)
          test "$actual" = "$expected" || test "$actual" = "$target"
          test "$(gh api "repos/$GH_REPO/actions/runs/40267844016" --jq .head_sha)" = "$target"
          test "$(gh api "repos/$GH_REPO/actions/runs/40267844016" --jq .conclusion)" = success
          test "$(gh api "repos/$GH_REPO/releases/tags/v2.10.0" --jq .id)" = 436953000
          if test "$actual" != "$target"; then
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/v2.10.0" -f sha="$target" -F force=true
          fi
          gh api --method PATCH "repos/$GH_REPO/releases/436953000" -f target_commitish="$target" >/dev/null
          test "$(gh api "repos/$GH_REPO/git/ref/tags/v2.10.0" --jq .object.sha)" = "$target"
          echo "PASS: v2.10.0 tag points to the successful three-platform build source."
