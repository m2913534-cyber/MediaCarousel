name: Build desktop apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: MediaCarousel-v2.1-GitHub-AutoBuild
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            label: Windows-x64
            arch: x64
          - runner: macos-15
            label: Mac-Apple-Silicon
            arch: arm64
          - runner: macos-15-intel
            label: Mac-Intel
            arch: x64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: ${{ matrix.arch }}
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build application
        run: python build.py
      - name: Check application startup
        run: python ci_verify.py
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force packages
          Compress-Archive -Path dist/MediaCarousel -DestinationPath packages/MediaCarousel-Windows-x64.zip
      - name: Package Mac
        if: runner.os == 'macOS'
        env:
          BUILD_LABEL: ${{ matrix.label }}
        run: |
          mkdir -p packages
          ditto -c -k --sequesterRsrc --keepParent dist/MediaCarousel.app "packages/MediaCarousel-$BUILD_LABEL.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: MediaCarousel-${{ matrix.label }}
          path: MediaCarousel-v2.1-GitHub-AutoBuild/packages/*.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all platform packages
        uses: actions/download-artifact@v8
        with:
          pattern: MediaCarousel-*
          path: release
          merge-multiple: true
      - name: Verify required packages and generate SHA256
        working-directory: release
        shell: bash
        run: |
          set -euo pipefail
          for f in MediaCarousel-Windows-x64.zip MediaCarousel-Mac-Apple-Silicon.zip MediaCarousel-Mac-Intel.zip; do
            test -s "$f" || { echo "::error::Missing or empty $f"; exit 1; }
            unzip -t "$f" >/dev/null
          done
          sha256sum MediaCarousel-Windows-x64.zip MediaCarousel-Mac-Apple-Silicon.zip MediaCarousel-Mac-Intel.zip > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Release already exists; refusing to overwrite published assets."
            exit 1
          fi
          gh release create "$RELEASE_TAG" release/*.zip release/SHA256SUMS.txt \
            --title "MediaCarousel $RELEASE_TAG" \
            --generate-notes \
            --verify-tag \
            --latest
