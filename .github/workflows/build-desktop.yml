name: Build desktop apps

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the bundle version after all checks pass
        type: boolean
        default: false
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: MediaCarousel-v2.1-GitHub-AutoBuild
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            label: Windows-x64
            arch: x64
          # Standard macOS 15 runner is arm64; architecture is checked before building.
          - runner: macos-15
            label: Mac-Apple-Silicon
            arch: arm64
          - runner: macos-15-intel
            label: Mac-Intel
            arch: x64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: ${{ matrix.arch }}
      - name: Verify build architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: python -c "import os,platform; actual=platform.machine().lower(); assert actual in ({'x64':('amd64','x86_64'),'arm64':('arm64','aarch64')}[os.environ['EXPECTED_ARCH']]), actual"
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build application
        run: python build.py
      - name: Check application startup
        run: python ci_verify.py
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force packages
          Compress-Archive -Path dist/MediaCarousel -DestinationPath packages/MediaCarousel-Windows-x64.zip
      - name: Package Mac
        if: runner.os == 'macOS'
        env:
          BUILD_LABEL: ${{ matrix.label }}
        run: |
          mkdir -p packages
          ditto -c -k --sequesterRsrc --keepParent dist/MediaCarousel.app "packages/MediaCarousel-$BUILD_LABEL.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: MediaCarousel-${{ matrix.label }}
          path: MediaCarousel-v2.1-GitHub-AutoBuild/packages/*.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Verify release packages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Download all platform packages
        uses: actions/download-artifact@v8
        with:
          pattern: MediaCarousel-*
          path: release
          merge-multiple: true
      - name: Verify packages, generate SHA256 and release notes
        run: python .github/scripts/verify_release.py release
      - uses: actions/upload-artifact@v7
        with:
          name: Release-metadata
          path: |
            release/SHA256SUMS.txt
            release/RELEASE-NOTES.md
          if-no-files-found: error
          retention-days: 30
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_release)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="v$(python -c "import re; from pathlib import Path; print(re.search(r\"'CFBundleShortVersionString':'([^']+)'\", Path('MediaCarousel-v2.1-GitHub-AutoBuild/MediaCarousel.spec').read_text()).group(1))")"
          tag_args=(--target "$RELEASE_COMMIT")
          if [[ "$RELEASE_REF" == refs/tags/* ]]; then
            tag_args=(--verify-tag)
          elif gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Tag already exists; use the tag-triggered workflow."
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Release already exists; refusing to overwrite assets."
            exit 1
          fi
          gh release create "$RELEASE_TAG" release/*.zip release/SHA256SUMS.txt release/RELEASE-NOTES.md \
            --title "MediaCarousel $RELEASE_TAG" --notes-file release/RELEASE-NOTES.md \
            --generate-notes "${tag_args[@]}" --draft
          gh release edit "$RELEASE_TAG" --draft=false --latest
