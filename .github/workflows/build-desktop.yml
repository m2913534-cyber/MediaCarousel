name: Build desktop apps

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: MediaCarousel-v2.1-GitHub-AutoBuild
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            label: Windows-x64
            arch: x64
          - runner: macos-15
            label: Mac-Apple-Silicon
            arch: arm64
          - runner: macos-15-intel
            label: Mac-Intel
            arch: x64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: ${{ matrix.arch }}
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build application
        run: python build.py
      - name: Check application startup
        run: python ci_verify.py
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force packages
          Compress-Archive -Path dist/MediaCarousel -DestinationPath packages/MediaCarousel-Windows-x64.zip
      - name: Package Mac
        if: runner.os == 'macOS'
        env:
          BUILD_LABEL: ${{ matrix.label }}
        run: |
          mkdir -p packages
          ditto -c -k --sequesterRsrc --keepParent dist/MediaCarousel.app "packages/MediaCarousel-$BUILD_LABEL.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: MediaCarousel-${{ matrix.label }}
          path: MediaCarousel-v2.1-GitHub-AutoBuild/packages/*.zip
          if-no-files-found: error
          retention-days: 30
